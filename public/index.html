<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0066cc">
    <meta name="description" content="Dashboard: Status aller getrackten Puppet-Module">
    <title>Version Tracker</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <!-- Theme vor dem Stylesheet setzen: Script wartet so nicht auf das CSS, kein Flash -->
    <script src="/scripts/theme-init.js?v=5"></script>
    <link rel="stylesheet" href="/styles/shared.css?v=5">
    <!-- Prefetch Detail-Seiten für schnellere Navigation -->
    <link rel="prefetch" href="/puppet.html">
</head>
<body>
    <a href="#main" class="skip-link">Zum Inhalt springen</a>
    <nav class="nav" aria-label="Hauptnavigation">
        <div class="nav-container">
            <a href="/" class="nav-brand">Version Tracker</a>
            <button class="nav-toggle" id="navToggle" aria-label="Menü" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
            <div class="nav-links" id="navLinks">
                <a href="/" class="active" aria-current="page">Dashboard</a>
                <a href="/puppet.html">Puppet Module</a>
                <button id="themeToggle" class="btn btn-secondary" aria-label="Farbschema wechseln">Theme</button>
            </div>
        </div>
    </nav>

    <main class="container" id="main">
        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Status-Übersicht aller getrackten Versionen</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat">
                <div class="stat-value" id="puppetStatus">-</div>
                <div class="stat-label">Puppet Module</div>
            </div>
        </div>

        <div class="card-grid">
            <a href="/puppet.html" class="card card-link">
                <h3 class="mb-1">Puppet Module</h3>
                <p class="text-muted">Vergleich zwischen installierten und aktuellen Forge-Versionen</p>
            </a>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-2">
                <h3>Status Details</h3>
                <span class="text-muted text-small" id="lastUpdated" aria-live="polite"></span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Kategorie</th>
                            <th scope="col">Status</th>
                            <th scope="col">Details</th>
                        </tr>
                    </thead>
                    <tbody id="statusTable">
                        <tr><td colspan="3"><div class="loading"><div class="spinner"></div> Laden...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/scripts/shared.js?v=5"></script>
    <script src="/scripts/index.js?v=5"></script>
</body>
</html>
